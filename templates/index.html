<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Extractor Service</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            min-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            padding: 1.75rem;
            margin-bottom: 2rem;
        }

        .upload-card {
            max-width: 500px;
            margin: 0 auto 2.5rem;
            text-align: center;
        }

        .upload-card h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .upload-card p {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 1.25rem;
        }

        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.4rem;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .iframe-card h3 {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            iframe {
                height: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card upload-card">
            <h2>Upload Table Images</h2>
            <p>Supported formats: JPG, PNG</p>

            <form action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="files" multiple accept="image/*" />
                <button type="submit">Process & Download PDF</button>
            </form>
        </div>

        <div class="card iframe-card">
            <h3>Document AI Preview</h3>
            <iframe src="https://www.gstatic.com/cloud-site-ux/document_ai/document_ai.min.html"
                loading="lazy"></iframe>
        </div>
    </div>
</body>

</html>
